<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09050d">
  <title>Happy Birthday, My Bestie Kainat ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <main class="wrap">
    <header class="topbar">
      <span class="mini-brand">A LITTLE SURPRISE <b>♡</b></span>
      <button id="soundBtn" class="sound" aria-label="Toggle music">♪</button>
    </header>

    <section class="phone" id="phone">
      <div class="top-line"><span></span><i id="progressBar"></i></div>
      <div id="screen" class="screen"></div>
      <footer class="footer"><span id="stepLabel">01 / 08</span><span>FOR MY BESTIE KAINAT</span></footer>
    </section>

    <div class="made">made with love <span>♥</span></div>
  </main>

  <audio id="music" src="assets/birthday-song.m4a" preload="auto" loop></audio>
  <script src="script.js"></script>
</body>
</html>
